<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Unique Primary Meta Tags for Homepage -->
    <title>Neesh AI | Turn Raw Ideas Into Interactive Validation Loops</title>
    <meta name="title" content="Neesh AI | Turn Raw Ideas Into Interactive Validation Loops" />
    <meta name="description" content="Validate your startup idea with real audience feedback and interactive AI chatbot loops before writing a single line of code." />
    <meta name="author" content="Neesh AI" />
    <link rel="canonical" href="https://neeshglobal.com/" />

    <!-- Open Graph / Facebook / LinkedIn / Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neeshglobal.com/" />
    <meta property="og:title" content="Neesh AI | Turn Raw Ideas Into Interactive Validation Loops" />
    <meta property="og:description" content="Validate your startup idea with real audience feedback and interactive AI chatbot loops before writing a single line of code." />
    <meta property="og:image" content="https://neeshglobal.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Neesh AI" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NeeshAI" />
    <meta name="twitter:title" content="Neesh AI | Turn Raw Ideas Into Interactive Validation Loops" />
    <meta name="twitter:description" content="Validate your startup idea with real audience feedback and interactive AI chatbot loops before writing a single line of code." />
    <meta name="twitter:image" content="https://neeshglobal.com/og-default.png" />

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js" async></script>

    <!-- JSON-LD: Organization + WebSite + SoftwareApplication + FAQPage schemas -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Neesh AI",
      "url": "https://neeshglobal.com",
      "logo": "https://neeshglobal.com/neesh-logo.png",
      "description": "AI-powered startup idea validation and development platform.",
      "sameAs": [
        "https://twitter.com/NeeshAI",
        "https://producthunt.com/products/neesh-ai",
        "https://github.com/neeshai"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Neesh AI",
      "url": "https://neeshglobal.com",
      "description": "AI-powered startup idea validation and development platform",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://neeshglobal.com/space?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Neesh AI",
      "description": "AI-powered startup idea validation and development platform. Validate startup concepts with elevator pitch reels, custom chatbots, and audience feedback.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://neeshglobal.com",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "sameAs": [
        "https://twitter.com/NeeshAI",
        "https://producthunt.com/products/neesh-ai",
        "https://github.com/neeshai"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does Neesh AI validate raw startup ideas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Neesh AI converts your notes into publishable Spotlight pages and short-form pitch reels. Custom AI chatbots engage visitors, answer questions 24/7, and surface objection points and confusion signals."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to write code to use Neesh AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Neesh AI is completely code-free. You can upload pitch reels, train chatbots, and collect structured feedback without writing code."
          }
        },
        {
          "@type": "Question",
          "name": "How does the context-aware AI chatbot get trained?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can upload your pitch decks, FAQs, whitepapers, or project briefs. The AI indexes your documents to answer visitor questions accurately."
          }
        },
        {
          "@type": "Question",
          "name": "Is Neesh AI free to use during Beta?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Neesh AI is completely free during our beta period for founders and creators."
          }
        }
      ]
    }
    </script>
  </head>

  <body class="bg-[#050b14] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
